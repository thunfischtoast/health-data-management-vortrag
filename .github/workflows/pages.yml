# Publishes the deck to GitHub Pages: main at the site root, the erlangen
# branch under /erlangen. Every run builds both from their latest commits,
# so a push to either branch never drops the other from the site.
# The group photos may not be published, so the site gets a placeholder in
# their place; templates, notes and reports stay out.
name: Pages

on:
  push:
    branches: [main, erlangen]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src/main

      - name: Check out erlangen
        uses: actions/checkout@v4
        with:
          ref: erlangen
          path: src/erlangen

      - name: Assemble site without the group photos
        run: |
          # One placeholder (from main) for both versions, so the guard has
          # a single reference to compare against.
          placeholder=src/main/tools/pages/photo-placeholder.jpg

          # assemble <checkout dir> <target dir>
          assemble() {
            mkdir -p "$2"
            for item in index.html css js assets vendor; do
              cp -r "$1/$item" "$2/"
            done
            for f in "$2"/assets/img/group_*.jpg; do
              [ -e "$f" ] || continue
              cp "$placeholder" "$f"
            done
          }

          assemble src/main     _site
          assemble src/erlangen _site/erlangen

          # Guard: every JPEG in the site must be the placeholder.
          find _site -type f -iname '*.jp*g' | while read -r f; do
            cmp -s "$placeholder" "$f" || { echo "Unexpected photo: $f" >&2; exit 1; }
          done

      - uses: actions/configure-pages@v5

      # Artifact name includes the attempt number, so "Re-run jobs" doesn't
      # find the previous attempt's artifact next to its own.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}